services:
  # Frontend Service
  - type: web
    name: harmonix-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://harmonix-backend.onrender.com
      - key: REACT_APP_PYTHON_SERVICE_URL
        value: https://harmonix-python.onrender.com

  # Backend Service
  - type: web
    name: harmonix-backend
    runtime: node
    region: oregon
    plan: starter
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: MONGODB_URI
        fromDatabase:
          name: harmonix-mongodb
          property: connectionString
      - key: PYTHON_SERVICE_URL
        value: https://harmonix-python.onrender.com
      - key: PORT
        value: 5001

  # Server Service
  - type: web
    name: harmonix-server
    runtime: node
    region: oregon
    plan: starter
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: MONGO_URL
        fromDatabase:
          name: harmonix-mongodb
          property: connectionString
      - key: PYTHON_SERVICE_URL
        value: https://harmonix-python.onrender.com
      - key: PORT
        value: 4000

  # Python Service
  - type: web
    name: harmonix-python
    runtime: python
    region: oregon
    plan: starter
    buildCommand: cd python_service && pip install -r requirements.txt
    startCommand: cd python_service && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000

databases:
  - name: harmonix-mongodb
    databaseName: harmonix
    user: harmonix
