name: Deploy Harmonix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:4.4
        ports:
          - 27017:27017
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Updated to v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4 # Updated to v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json  
          server/package-lock.json
    
    - name: Setup Python
      uses: actions/setup-python@v5 # Updated to v5
      with:
        python-version: '3.9'
        cache: 'pip'
        cache-dependency-path: python_service/requirements.txt
    
    - name: Install Python dependencies
      run: |
        cd python_service
        pip install -r requirements.txt
    
    - name: Install Node dependencies
      run: |
        cd frontend && npm install
        cd ../backend && npm install  
        cd ../server && npm install
    
    - name: Run tests
      run: |
        # Add your test commands here
        echo "Running tests..."
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build

  deploy-to-render:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Updated to v4
    
    - name: Check Render secrets
      run: |
        if [ -z "${{ secrets.RENDER_SERVICE_ID }}" ] || [ -z "${{ secrets.RENDER_API_KEY }}" ]; then
          echo "Warning: Render secrets not configured. Skipping Render deployment."
          exit 0
        fi
    
    - name: Deploy to Render
      if: success()
      uses: johnbeynon/render-deploy-action@v0.0.8
      with:
        service-id: ${{ secrets.RENDER_SERVICE_ID }}
        api-key: ${{ secrets.RENDER_API_KEY }}

  deploy-to-vercel:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Updated to v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4 # Updated to v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Check Vercel secrets
      run: |
        if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
          echo "Warning: Vercel token not configured. Skipping Vercel deployment."
          exit 0
        fi
    
    - name: Install dependencies
      if: success()
      run: |
        cd frontend
        npm install
    
    - name: Build project
      if: success()
      run: |
        cd frontend
        npm run build
    
    - name: Deploy to Vercel
      if: success()
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-args: '--prod'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./frontend
